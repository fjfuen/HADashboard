            force_icon: false
            show_icon: true
            modules:
              - bubble_chips
              - icon_animations
              - visual_styling_center
              - humidity_colouring
              - text_customizer
            humidity_colouring:
              humidity_sensor: sensor.kbhm_relative_humidity
              elements:
                state_display: true
            animated_icon:
              mode: heat_pump
              conditions:
                - condition: state
                  entity_id: climate.home
                  state:
                    - heating
                  attribute: hvac_action
              background: red
            conditional_icon:
              conditions:
                - condition: state
                  state:
                    - idle
                  entity_id: climate.home
                  attribute: hvac_action
              icon_true: mdi:hvac-off
            grid_options:
              columns: 5
              rows: auto
            sub_button:
              main: []
              bottom: []
            icon: ''
            icon_animations:
              animation_type: bounce
              animate_when:
                - condition: or
                  conditions:
                    - condition: numeric_state
                      entity_id: sensor.home_current_humidity
                      above: 59
                    - condition: numeric_state
                      entity_id: climate.home
                      below: 40
                      attribute: current_humidity
            visual_styling_center:
              apply_to_main_icon: true
              enable_icon_helper: false
              manual_icon_color: cyan
              gradient_target: slider
              inner_padding: 0
              icon_vertical_margin: -10
            get_state_attribute:
              - entity: sensor.home_current_humidity
              - entity: sensor.water_sensor_7_pro_humidity
            text_customizer:
              state_font_size: '15'
              name_font_weight: 300
              state_font_weight: 700
              card_gap: 0
            scrolling_effect: false
            show_name: false
            bubble_chips:
              justify-content: flex-start
            card_layout: normal
          - type: custom:bubble-card
            card_type: separator
            card_layout: large
            icon: mdi:home-outline
            sub_button:
              main:
                - show_background: false
                  tap_action:
                    action: none
                  content_layout: icon-left
              bottom: []
            styles: >
              /* Showing formatted date and time in a separator without using
              any entity */

              /* From patreon.com/Clooos */


              .bubble-line {
                background: var(--primary-text-color);
                opacity: 0.1;
              }


              .bubble-sub-button-1 {
                font-size: 22px !important;
                flex-direction: row;
              }


              ${(() => {
                const now = new Date();
                const locale = hass.locale;
                const timeString = now.toLocaleTimeString(locale.language, {
                  hour: 'numeric', minute: 'numeric', hour12: locale?.time_format === '12'
                });

                const formattedTime = timeString.replace(/([APM]{2})$/, '<span style="font-size: 12px; margin: 6px 4px 0">$1</span>');

                card.querySelector('.bubble-sub-button-1').innerHTML = formattedTime;
                card.querySelector('.bubble-name').innerText = now.toLocaleDateString(locale.language, {
                  weekday: 'long', day: 'numeric', month: 'long'
                }).replace(/^./, str => str.toUpperCase());
              })()}
