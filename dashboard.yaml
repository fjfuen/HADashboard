    header:
      card:
        type: markdown
        content: |-

          {% if (states("sensor.time_of_day") == "morning") %}
            # Good Morning, {{user}}!
            {{ states("input_text.ai_morning_brief") }}
          {% elif (states("sensor.time_of_day") == "day") %}
            # Hey, {{user}}!
            It's {{ states("sensor.time") }}, the weather is {{ state_translated("weather.kbhm") | lower }} with {{ state_attr("weather.kbhm","temperature") }}°F. Right now there are {{ states("sensor.lights_on_count") }} lights on and {{ states("sensor.door_open_count") }} doors open. The security system is set to {{ state_translated("alarm_control_panel.alarmo") }}.
          {% elif (states("sensor.time_of_day") == "evening") %}
            # Good Evening, {{user}}!
            It's {{ states("sensor.time") }}, the weather is {{ state_translated("weather.kbhm") | lower }} with {{ state_attr("weather.kbhm","temperature") }}°F. Right now there are {{ states("sensor.lights_on_count") }} lights on and {{ states("sensor.door_open_count") }} doors open. The security system is set to {{ state_translated("alarm_control_panel.alarmo") }}. {% if states("automation.alarm_clock") == "on" %}Your alarm is set to {{ states("input_datetime.alarm_time") }}.{% endif %} 

          {% elif (states("sensor.time_of_day") == "night") %}
            # Good Night, {{user}}!
            It's {{ states("sensor.time") }}, the weather is {{ state_translated("weather.kbhm") | lower }} with {{ state_attr("weather.kbhm","temperature") }}°F. Right now there are {{ states("sensor.lights_on_count") }} lights on and {{ states("sensor.door_open_count") }} windows open. The security system is set to {{ state_translated("alarm_control_panel.alarmo") }}. {% if states("automation.alarm_clock") == "on" %}Your alarm is set to {{ states("input_datetime.alarm_time") }}.{% endif %} 

          {% endif %}
        visibility:
          - condition: screen
            media_query: '(min-width: 0px)'
