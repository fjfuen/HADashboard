            styles: >
              /* Showing formatted date and time in a separator without using
              any entity */

              /* From patreon.com/Clooos */


              .bubble-line {
                background: var(--primary-text-color);
                opacity: 0.1;
              }


              .bubble-sub-button-1 {
                font-size: 22px !important;
                flex-direction: row;
              }


              ${(() => {
                const now = new Date();
                const locale = hass.locale;
                const timeString = now.toLocaleTimeString(locale.language, {
                  hour: 'numeric', minute: 'numeric', hour12: locale?.time_format === '12'
                });

                const formattedTime = timeString.replace(/([APM]{2})$/, '<span style="font-size: 12px; margin: 6px 4px 0">$1</span>');

                card.querySelector('.bubble-sub-button-1').innerHTML = formattedTime;
                card.querySelector('.bubble-name').innerText = now.toLocaleDateString(locale.language, {
                  weekday: 'long', day: 'numeric', month: 'long'
                }).replace(/^./, str => str.toUpperCase());
              })()}
          - type: custom:bubble-card
            card_type: button
            button_type: state
            sub_button:
              main: []
              bottom: []
            entity: device_tracker.iphone17pro_meli
            scrolling_effect: false
            show_name: false
            show_state: false
            show_attribute: false
            modules:
              - visual_styling_center
              - bubble_chips
            visual_styling_center:
              height_multiplier: 1
              icon_size_multiplier: 1.25
              icon_background_ratio: 1
              hide_icon_background: false
              enable_entity_colored_main_icon: false
              gradient_target: background
              enable_gradient: false
            grid_options:
              columns: 2
              rows: 1
            visibility:
              - condition: user
                users: []
            frosted_glass:
              shadow:
                icon_shadow_style: icon_shadow_frosted
                main_shadow_style: main_shadow_off
                sub_shadow_style: sub_shadow_frosted
            slider_fill_orientation: left
            slider_value_position: right
          - type: custom:bubble-card
