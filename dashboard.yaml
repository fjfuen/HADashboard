navbar-templates:
  homenavbar-MT:
    routes:
      - icon: mdi:home
        label: Home
        url: /dashboard-copy/Home
      - icon: mdi:cctv
        label: Frigate
        url: /dashboard-copy/frigate?show_header
      - icon: mdi:remote-tv
        label: TV Control
        tap_action:
          action: navigate
          navigation_path: '#livingroomTV'
        double_tap_action:
          action: navigate
          navigation_path: '#basementTV'
      - icon: mdi:multimedia
        label: Media
        url: /dashboard-copy/media
    desktop:
      position: bottom
      show_labels: true
      mode: floating
      show_popup_label_backgrounds: true
    mobile:
      position: bottom
      show_labels: true
      mode: docked
      show_popup_label_backgrounds: true
    layout:
      auto_padding:
        enabled: true
      reflect_child_state: false
    styles: |
      .navbar {
        --navbar-primary-color:rgb(205, 205, 150);
      }
      .navbar-card {
        background: rgba(55, 55, 55, 0.4);
        backdrop-filter: blur(50px);
        border: none;
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1) !important;
      }
  homenavbar-ff:
    routes:
      - icon: mdi:home
        label: Home
        url: /dashboard-copy/Home
      - icon: mdi:cctv
        label: Frigate
        url: /dashboard-copy/frigate
      - icon: mdi:remote-tv
        label: TV Control
        tap_action:
          action: navigate
          navigation_path: '#livingroomTV'
        double_tap_action:
          action: navigate
          navigation_path: '#basementTV'
      - icon: mdi:web-plus
        label: Pages
        tap_action:
          action: open-popup
        popup:
          - icon: mdi:movie
            label: Media
            url: /dashboard-copy/media
          - icon: mdi:view-dashboard
            label: Stats
            url: /dashboard-copy/jellystats
          - icon: mdi:view-dashboard
            label: Glance
            url: /dashboard-copy/Glance
          - icon: mdi:battery
            label: Batteries
            tap_action:
              action: navigate
              navigation_path: '#battery'
      - icon: mdi:server-network
        url: /dashboard-copy/server
        label: Server
        double_tap_action:
          action: open-popup
        popup:
          - icon: mdi:lan
            label: Nodes
            tap_action:
              action: custom-js-action
              code: |
                [[[
                  hass.callService('input_select', 'select_option', {
                    entity_id: 'input_select.server',
                    option: 'Nodes'
                  });
                ]]]
          - icon: mdi:docker
            label: Containers
            tap_action:
              action: custom-js-action
              code: |
                [[[
                  hass.callService('input_select', 'select_option', {
                    entity_id: 'input_select.server',
                    option: 'Containers'
                  });
                ]]]
          - icon: mdi:nas
            label: OMV
            tap_action:
              action: custom-js-action
              code: |
                [[[
                  hass.callService('input_select', 'select_option', {
                    entity_id: 'input_select.server',
                    option: 'OMV'
                  });
                ]]]
          - icon: mdi:router-network
            label: Networking
            tap_action:
              action: custom-js-action
              code: |
                [[[
                  hass.callService('input_select', 'select_option', {
                    entity_id: 'input_select.server',
                    option: 'Network'
                  });
                ]]]
    desktop:
      position: bottom
      show_labels: true
      mode: floating
      show_popup_label_backgrounds: true
    mobile:
      position: bottom
      show_labels: true
      mode: docked
      show_popup_label_backgrounds: true
    layout:
      auto_padding:
        enabled: true
      reflect_child_state: false
    styles: |
      .navbar {
        --navbar-primary-color:rgb(205, 205, 150);
      }
      .navbar-card {
        background: rgba(55, 55, 55, 0.4);
        backdrop-filter: blur(50px);
        border: none;
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1) !important;
      }
views:
  - type: sections
    max_columns: 4
    title: Home
    path: Home
    visible:
      - user: e0e65d47982e457eb3c018e971260f2b
      - user: 445c8a17bd4b4984bb9246895420463a
      - user: 432e5ee41c2b46d29274b61978d9ae87
