                const now = new Date();
                const locale = hass.locale;
                const timeString = now.toLocaleTimeString(locale.language, {
                  hour: 'numeric', minute: 'numeric', hour12: locale?.time_format === '12'
                });
                const formattedTime = timeString.replace(/([APM]{2})$/, '<span style="font-size: 16px; margin: 6px 4px 0">$1</span>');
                card.querySelector('.bubble-sub-button-1').innerHTML = formattedTime;
                card.querySelector('.bubble-name').innerText = now.toLocaleDateString(locale.language, {
                  weekday: 'long', day: 'numeric', month: 'long'
                }).replace(/^./, str => str.toUpperCase());
              })()}
            grid_options:
              columns: 24
              rows: 0.8
          - square: false
            type: grid
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: climate.house_thermostat
                show_last_changed: false
                show_state: false
                show_attribute: true
                attribute: current_temperature
                name: House
                force_icon: false
                show_icon: true
                modules:
                  - icon_animations
                  - text_customizer
                  - visual_styling_center
                  - liquid_glass_light
                animated_icon:
                  mode: heat_pump
                  conditions:
                    - condition: state
                      entity_id: climate.house_thermostat
                      state:
                        - heating
                      attribute: hvac_action
                  background: red
                grid_options:
                  columns: 4
                  rows: auto
                sub_button:
                  main: []
                  bottom: []
                icon: mdi:air-conditioner
