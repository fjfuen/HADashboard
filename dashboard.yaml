navbar-templates:
  homenavbar:
    routes:
      - icon: mdi:home
        label: Home
        url: /dashboard-copy/Home
      - hold_action:
          action: navigate
          navigation_path: /config/devices/dashboard
        icon: mdi:bed-double
        label: Rooms
        url: /dashboard-copy/rooms
        tap_action: null
      - icon: mdi:cctv
        label: Frigate
        url: /dashboard-copy/frigate?show_header
      - icon: mdi:multimedia
        label: Media
        url: /dashboard-copy/media
      - icon: mdi:dots-horizontal
        label: More
        popup:
          - icon: mdi:server-network
            url: /dashboard-copy/server
            label: Server
          - icon: mdi:hammer
            url: /config
            label: Settings
          - icon: mdi:power
            label: Restart
            tap_action:
              action: call-service
              confirmation:
                text: Are you sure you want to restart Home Assistant?
              service: homeassistant.restart
              service_data: {}
          - icon: mdi:cctv
            label: Security
            url: /dashboard-copy/security
        tap_action:
          action: open-popup
    desktop:
      position: left
      show_labels: true
      mode: floating
      show_popup_label_backgrounds: true
    mobile:
      position: bottom
      show_labels: true
      mode: docked
      show_popup_label_backgrounds: true
    layout:
      auto_padding:
        enabled: true
      reflect_child_state: false
    styles: |
      .navbar {
        --navbar-primary-color:rgb(205, 205, 150);
      }
      .navbar-card {
        background: rgba(55, 55, 55, 0.4);
        backdrop-filter: blur(50px);
        border: none;
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1) !important;
      }
