            show_state: true
            button_type: name
            sub_button:
              main: []
              bottom: []
            slider_fill_orientation: left
            slider_value_position: right
            styles: ''
            bg_opacity: '25'
            show_header: true
            hide_backdrop: true
            margin_top_mobile: 0px
            show_attribute: false
            cards:
              - type: iframe
                url: https://sonarr.fjlab.fyi
                aspect_ratio: 50%
            scrolling_effect: false
    header:
      card:
        type: markdown
        content: |-

          {% if (states("sensor.time_of_day") == "morning") %}
            # Good Morning, {{user}}!
            {{ states("input_text.ai_morning_brief") }}
          {% elif (states("sensor.time_of_day") == "day") %}
            # Hey, {{user}}!
            It's {{ states("sensor.time") }}, the weather is {{ state_translated("weather.kbhm") | lower }} with {{ state_attr("weather.kbhm","temperature") }}°F. Right now there are {{ states("sensor.lights_on_count") }} lights on and {{ states("sensor.door_open_count") }} doors open. The security system is set to {{ state_translated("alarm_control_panel.alarmo") }}.
          {% elif (states("sensor.time_of_day") == "evening") %}
            # Good Evening, {{user}}!
            It's {{ states("sensor.time") }}, the weather is {{ state_translated("weather.kbhm") | lower }} with {{ state_attr("weather.kbhm","temperature") }}°F. Right now there are {{ states("sensor.lights_on_count") }} lights on and {{ states("sensor.door_open_count") }} doors open. The security system is set to {{ state_translated("alarm_control_panel.alarmo") }}. {% if states("automation.alarm_clock") == "on" %}Your alarm is set to {{ states("input_datetime.alarm_time") }}.{% endif %} 

          {% elif (states("sensor.time_of_day") == "night") %}
            # Good Night, {{user}}!
            It's {{ states("sensor.time") }}, the weather is {{ state_translated("weather.kbhm") | lower }} with {{ state_attr("weather.kbhm","temperature") }}°F. Right now there are {{ states("sensor.lights_on_count") }} lights on and {{ states("sensor.window_open_count") }} windows open. The security system is set to {{ state_translated("alarm_control_panel.alarmo") }}. {% if states("automation.alarm_clock") == "on" %}Your alarm is set to {{ states("input_datetime.alarm_time") }}.{% endif %} 

          {% endif %}
        visibility:
          - condition: screen
            media_query: '(min-width: 768px)'
        text_only: true
      layout: responsive
      badges_position: top
      badges_wrap: scroll
    badges:
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: alarm_control_panel.alarmo
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.lights_on_count
        state_content: state
        color: yellow
        name: Lights On
        tap_action:
          action: navigate
          navigation_path: '#Lights'
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: sensor.door_open_count
        icon: mdi:door-open
        color: white
        visibility:
          - condition: numeric_state
            entity: sensor.window_open_count
            above: 0
        name: Doors Open
        tap_action:
          action: navigate
          navigation_path: '#Doors'
      - type: custom:mushroom-template-badge
        icon: mdi:lightning-bolt
        entity: sensor.garage_desk_electric_consumption_w
        content: '{{states("sensor.garage_desk_electric_consumption_w")}}'
        color: >-
          {% set state=states("sensor.garage_desk_electric_consumption_w") |
          float(-1) %}


          {% if state >= 100 %}
            red
          {% elif state >= 34 and state <= 100 %}
           orange
          {% elif state <= 33 %}
            green
          {% endif %}
        label: Network Rack
    background:
      opacity: 30
      alignment: center
      size: cover
      repeat: no-repeat
      attachment: fixed
      image:
        media_content_id: media-source://image_upload/5f9ee61229571e2e3f7856cdb048e060
        media_content_type: image/jpeg
        metadata:
          title: benjamin-voros-U-Kty6HxcQc-unsplash.jpg
          thumbnail: /api/image/serve/5f9ee61229571e2e3f7856cdb048e060/256x256
          media_class: image
          children_media_class: null
          navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://image_upload
    cards: []
    visible:
      - user: e0e65d47982e457eb3c018e971260f2b
